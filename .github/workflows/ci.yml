name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Swift toolchain
        run: swift --version
      - name: Build Swift app
        run: swift build
      - name: Test Swift app
        run: swift test
      - name: Check open core boundary
        run: python3 Tests/Scripts/test_open_core.py
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Test website
        run: pnpm test
        working-directory: site
      - name: Typecheck website
        run: pnpm typecheck
        working-directory: site
      - name: Build website
        run: pnpm build
        working-directory: site
